<style>
  :root {
    --bg: #0d0d0f;
    --surface: #141416;

    --border: #2a2a2e;

    --accent-thunderhill: #f07050;
    --text: #f0ede8;
    --muted: #6b6b72;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 14px; min-height: 100vh; padding: 32px 24px 64px; }
  header { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 36px; padding-bottom: 24px; border-bottom: 1px solid var(--border); flex-wrap: wrap; gap: 16px; }
  .title-block h1 { font-family: 'Bebas Neue', sans-serif; font-size: clamp(36px, 6vw, 64px); letter-spacing: 0.02em; line-height: 0.9; color: var(--text); }
  .title-block h1 span { color: var(--accent-laguna); }
  .title-block p { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--muted); letter-spacing: 0.12em; text-transform: uppercase; margin-top: 8px; }
  .legend { display: flex; gap: 20px; flex-wrap: wrap; }
  .legend-item { display: flex; align-items: center; gap: 8px; font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .dot { width: 8px; height: 8px; border-radius: 50%; }
  .controls { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; align-items: center; }
  .filter-group { display: flex; gap: 6px; flex-wrap: wrap; }
  .filter-divider { width: 1px; background: var(--border); align-self: stretch; margin: 0 2px; }
  .filter-btn { background: var(--surface2); border: 1px solid var(--border); color: var(--muted); font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; padding: 7px 14px; border-radius: 4px; cursor: pointer; transition: all 0.15s; }
  .filter-btn:hover { color: var(--text); border-color: #444; }
  .filter-btn.active { color: var(--bg); font-weight: 500; }
  .filter-btn.active[data-filter="all"] { background: var(--text); border-color: var(--text); }
  .filter-btn.active[data-track="Laguna Seca"] { background: var(--accent-laguna); border-color: var(--accent-laguna); }
  .filter-btn.active[data-track="Sonoma Raceway"] { background: var(--accent-sonoma); border-color: var(--accent-sonoma); }
  .filter-btn.active[data-track="Thunderhill"] { background: var(--accent-thunderhill); border-color: var(--accent-thunderhill); }
  .filter-btn.active[data-type="Motorcycle"] { background: #a87eff; border-color: #a87eff; }
  .filter-btn.active[data-type="Car / HPDE"] { background: #4ecda4; border-color: #4ecda4; }
  .filter-btn.active[data-type="School"] { background: #ff9f55; border-color: #ff9f55; }
  .filter-btn.active[data-day="Weekday"] { background: #60c0d4; border-color: #60c0d4; }
  .filter-btn.active[data-day="Weekend"] { background: #f0b060; border-color: #f0b060; }
  .sort-bar { margin-left: auto; display: flex; gap: 6px; align-items: center; }
  .sort-label { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; }
  select { background: var(--surface2); border: 1px solid var(--border); color: var(--text); font-family: 'DM Mono', monospace; font-size: 11px; padding: 7px 10px; border-radius: 4px; cursor: pointer; outline: none; }
  .count { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--muted); letter-spacing: 0.06em; margin-bottom: 12px; }
  .count strong { color: var(--text); }
  table { width: 100%; border-collapse: collapse; }
  thead th { font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--border); white-space: nowrap; cursor: pointer; user-select: none; }
  thead th:hover { color: var(--text); }
  thead th .sort-icon { margin-left: 5px; opacity: 0.4; }
  thead th.sorted .sort-icon { opacity: 1; color: var(--accent-laguna); }
  tbody tr { border-bottom: 1px solid rgba(255,255,255,0.04); transition: background 0.12s; }
  tbody tr:hover { background: rgba(255,255,255,0.03); }
  tbody td { padding: 13px 14px; vertical-align: middle; }
  .date-cell { font-family: 'DM Mono', monospace; font-size: 12px; white-space: nowrap; }
  .track-pill { display: inline-block; font-family: 'DM Mono', monospace; font-size: 11px; font-weight: 500; padding: 3px 9px; border-radius: 3px; letter-spacing: 0.04em; white-space: nowrap; }

  .track-Sonoma { background: rgba(91,163,245,0.15); color: var(--accent-sonoma); }
  .track-Thunderhill { background: rgba(240,112,80,0.15); color: var(--accent-thunderhill); }
  .event-name { font-size: 13px; font-weight: 400; color: var(--text); }
  .event-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .type-badge { display: inline-block; font-family: 'DM Mono', monospace; font-size: 10px; padding: 2px 8px; border-radius: 3px; letter-spacing: 0.06em; text-transform: uppercase; white-space: nowrap; }
  .type-Motorcycle { background: rgba(168,126,255,0.15); color: #a87eff; }
  .type-Car { background: rgba(78,205,164,0.15); color: #4ecda4; }
  .type-School { background: rgba(255,159,85,0.15); color: #ff9f55; }
  .price-cell { font-family: 'DM Mono', monospace; font-size: 12px; color: var(--text); white-space: nowrap; }
  .link-cell a { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--muted); text-decoration: none; border-bottom: 1px solid transparent; transition: all 0.15s; letter-spacing: 0.04em; }

  .empty-state { text-align: center; padding: 60px 20px; font-family: 'DM Mono', monospace; color: var(--muted); font-size: 12px; letter-spacing: 0.08em; }
  @media (max-width: 768px) { .sort-bar { margin-left: 0; } td:nth-child(6), th:nth-child(6) { display: none; } }

const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const days = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
function parseDate(str) { return new Date(str + "T12:00:00"); }
function formatDate(str, endStr) {
  const d = parseDate(str);
  const m = months[d.getMonth()], day = d.getDate(), dow = days[d.getDay()];
  if (endStr) {
    const e = parseDate(endStr);
    if (e.getMonth() !== d.getMonth()) return `${m} ${day}–${months[e.getMonth()]} ${e.getDate()}`;
    return `${m} ${day}–${e.getDate()}`;
  }
  return `${m} ${day} · ${dow}`;
}
let activeTrack = null, activeType = null, activeDay = null, sortCol = "date", sortDir = 1;
function getTrackClass(t) { return t==="Laguna Seca"?"track-Laguna":t==="Sonoma Raceway"?"track-Sonoma":"track-Thunderhill"; }
function getTypeClass(t) { return t==="Motorcycle"?"type-Motorcycle":t==="Car / HPDE"?"type-Car":"type-School"; }
function render() {
  let data = [...events];
  if (activeTrack) data = data.filter(e => e.track === activeTrack);
  if (activeType)  data = data.filter(e => e.type === activeType);
  if (activeDay) {
    data = data.filter(e => {
      const dow = parseDate(e.date).getDay(), isWeekend = dow===0||dow===6;
      return activeDay==="Weekend" ? isWeekend : !isWeekend;
    });
  }
  data.sort((a,b) => {
    const av = sortCol==="date"?a.date:sortCol==="track"?a.track:a.organizer;
    const bv = sortCol==="date"?b.date:sortCol==="track"?b.track:b.organizer;
    return av<bv?-sortDir:av>bv?sortDir:0;
  });
  document.getElementById("countLabel").innerHTML = `<strong>${data.length}</strong> event${data.length!==1?"s":""} shown`;
  const tbody = document.getElementById("tableBody");
  if (!data.length) { tbody.innerHTML=`<tr><td colspan="6" class="empty-state">No events match your filters.</td></tr>`; return; }
  tbody.innerHTML = data.map(e=>`
    <tr>
      <td class="date-cell">${formatDate(e.date,e.end)}</td>
      <td><span class="track-pill ${getTrackClass(e.track)}">${e.track}</span></td>
      <td><div class="event-name">${e.event}</div><div class="event-sub">${e.organizer}</div></td>
      <td><span class="type-badge ${getTypeClass(e.type)}">${e.type}</span></td>
      <td class="price-cell">${e.price}</td>
      <td class="link-cell"><a href="${e.url}" target="_blank">Register →</a></td>
    </tr>`).join("");
}
document.getElementById("trackFilters").addEventListener("click", e => {
  const btn = e.target.closest("button"); if (!btn) return;
  document.querySelectorAll("#trackFilters .filter-btn").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active"); activeTrack = btn.dataset.track||null; render();
});
document.getElementById("typeFilters").addEventListener("click", e => {
  const btn = e.target.closest("button"); if (!btn) return;
  const was = btn.classList.contains("active");
  document.querySelectorAll("#typeFilters .filter-btn").forEach(b=>b.classList.remove("active"));
  if (!was){btn.classList.add("active");activeType=btn.dataset.type;}else{activeType=null;} render();
});
document.getElementById("dayFilters").addEventListener("click", e => {
  const btn = e.target.closest("button"); if (!btn) return;
  const was = btn.classList.contains("active");
  document.querySelectorAll("#dayFilters .filter-btn").forEach(b=>b.classList.remove("active"));
  if (!was){btn.classList.add("active");activeDay=btn.dataset.day;}else{activeDay=null;} render();
});
document.getElementById("sortSelect").addEventListener("change", e=>{sortCol=e.target.value;render();});
document.querySelectorAll("thead th[data-col]").forEach(th=>{
  th.addEventListener("click",()=>{
    const col=th.dataset.col;
    if(sortCol===col){sortDir*=-1;}else{sortCol=col;sortDir=1;}
    document.getElementById("sortSelect").value=col;
    document.querySelectorAll("thead th").forEach(h=>h.classList.remove("sorted"));
    th.classList.add("sorted");
    th.querySelector(".sort-icon").textContent=sortDir===1?"↑":"↓";
    render();
  });
});
render();
</script>
