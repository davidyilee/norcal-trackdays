<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CA Track Day Schedule 2027</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0d0f;
    --surface: #141416;
    --surface2: #1c1c1f;
    --border: #2a2a2e;
    --accent-laguna: #e8b84b;
    --accent-sonoma: #5ba3f5;
    --accent-thunderhill: #f07050;
    --text: #f0ede8;
    --muted: #6b6b72;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 14px; min-height: 100vh; padding: 32px 24px 64px; }
  header { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 36px; padding-bottom: 24px; border-bottom: 1px solid var(--border); flex-wrap: wrap; gap: 16px; }
  .title-block h1 { font-family: 'Bebas Neue', sans-serif; font-size: clamp(36px, 6vw, 64px); letter-spacing: 0.02em; line-height: 0.9; color: var(--text); }
  .title-block h1 span { color: var(--accent-laguna); }
  .title-block p { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--muted); letter-spacing: 0.12em; text-transform: uppercase; margin-top: 8px; }
  .legend { display: flex; gap: 20px; flex-wrap: wrap; }
  .legend-item { display: flex; align-items: center; gap: 8px; font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .dot { width: 8px; height: 8px; border-radius: 50%; }
  .controls { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; align-items: center; }
  .filter-group { display: flex; gap: 6px; flex-wrap: wrap; }
  .filter-divider { width: 1px; background: var(--border); align-self: stretch; margin: 0 2px; }
  .filter-btn { background: var(--surface2); border: 1px solid var(--border); color: var(--muted); font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; padding: 7px 14px; border-radius: 4px; cursor: pointer; transition: all 0.15s; }
  .filter-btn:hover { color: var(--text); border-color: #444; }
  .filter-btn.active { color: var(--bg); font-weight: 500; }
  .filter-btn.active[data-filter="all"] { background: var(--text); border-color: var(--text); }
  .filter-btn.active[data-track="Laguna Seca"] { background: var(--accent-laguna); border-color: var(--accent-laguna); }
  .filter-btn.active[data-track="Sonoma Raceway"] { background: var(--accent-sonoma); border-color: var(--accent-sonoma); }
  .filter-btn.active[data-track="Thunderhill"] { background: var(--accent-thunderhill); border-color: var(--accent-thunderhill); }
  .filter-btn.active[data-type="Motorcycle"] { background: #a87eff; border-color: #a87eff; }
  .filter-btn.active[data-type="Car / HPDE"] { background: #4ecda4; border-color: #4ecda4; }
  .filter-btn.active[data-type="School"] { background: #ff9f55; border-color: #ff9f55; }
  .filter-btn.active[data-day="Weekday"] { background: #60c0d4; border-color: #60c0d4; }
  .filter-btn.active[data-day="Weekend"] { background: #f0b060; border-color: #f0b060; }
  .sort-bar { margin-left: auto; display: flex; gap: 6px; align-items: center; }
  .sort-label { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; }
  select { background: var(--surface2); border: 1px solid var(--border); color: var(--text); font-family: 'DM Mono', monospace; font-size: 11px; padding: 7px 10px; border-radius: 4px; cursor: pointer; outline: none; }
  .count { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--muted); letter-spacing: 0.06em; margin-bottom: 12px; }
  .count strong { color: var(--text); }
  table { width: 100%; border-collapse: collapse; }
  thead th { font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--border); white-space: nowrap; cursor: pointer; user-select: none; }
  thead th:hover { color: var(--text); }
  thead th .sort-icon { margin-left: 5px; opacity: 0.4; }
  thead th.sorted .sort-icon { opacity: 1; color: var(--accent-laguna); }
  tbody tr { border-bottom: 1px solid rgba(255,255,255,0.04); transition: background 0.12s; }
  tbody tr:hover { background: rgba(255,255,255,0.03); }
  tbody td { padding: 13px 14px; vertical-align: middle; }
  .date-cell { font-family: 'DM Mono', monospace; font-size: 12px; white-space: nowrap; }
  .track-pill { display: inline-block; font-family: 'DM Mono', monospace; font-size: 11px; font-weight: 500; padding: 3px 9px; border-radius: 3px; letter-spacing: 0.04em; white-space: nowrap; }
  .track-Laguna { background: rgba(232,184,75,0.15); color: var(--accent-laguna); }
  .track-Sonoma { background: rgba(91,163,245,0.15); color: var(--accent-sonoma); }
  .track-Thunderhill { background: rgba(240,112,80,0.15); color: var(--accent-thunderhill); }
  .event-name { font-size: 13px; font-weight: 400; color: var(--text); }
  .event-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .type-badge { display: inline-block; font-family: 'DM Mono', monospace; font-size: 10px; padding: 2px 8px; border-radius: 3px; letter-spacing: 0.06em; text-transform: uppercase; white-space: nowrap; }
  .type-Motorcycle { background: rgba(168,126,255,0.15); color: #a87eff; }
  .type-Car { background: rgba(78,205,164,0.15); color: #4ecda4; }
  .type-School { background: rgba(255,159,85,0.15); color: #ff9f55; }
  .price-cell { font-family: 'DM Mono', monospace; font-size: 12px; color: var(--text); white-space: nowrap; }
  .link-cell a { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--muted); text-decoration: none; border-bottom: 1px solid transparent; transition: all 0.15s; letter-spacing: 0.04em; }
  .link-cell a:hover { color: var(--text); border-bottom-color: var(--border); }
  .empty-state { text-align: center; padding: 60px 20px; font-family: 'DM Mono', monospace; color: var(--muted); font-size: 12px; letter-spacing: 0.08em; }
  @media (max-width: 768px) { .sort-bar { margin-left: 0; } td:nth-child(6), th:nth-child(6) { display: none; } }
</style>
</head>
<body>
<header>
  <div class="title-block">
    <h1>CA TRACK DAYS <span>2027</span></h1>
    <p>Laguna Seca · Sonoma Raceway · Thunderhill</p>
    <p><a href="index.html" style="color:inherit;">← 2026 Schedule</a></p>
  </div>
  <div class="legend">
    <div class="legend-item"><div class="dot" style="background:var(--accent-laguna)"></div>Laguna Seca</div>
    <div class="legend-item"><div class="dot" style="background:var(--accent-sonoma)"></div>Sonoma Raceway</div>
    <div class="legend-item"><div class="dot" style="background:var(--accent-thunderhill)"></div>Thunderhill</div>
  </div>
</header>
<div class="controls">
  <div class="filter-group" id="trackFilters">
    <button class="filter-btn active" data-filter="all">All Tracks</button>
    <button class="filter-btn" data-track="Laguna Seca">Laguna Seca</button>
    <button class="filter-btn" data-track="Sonoma Raceway">Sonoma</button>
    <button class="filter-btn" data-track="Thunderhill">Thunderhill</button>
  </div>
  <div class="filter-divider"></div>
  <div class="filter-group" id="typeFilters">
    <button class="filter-btn" data-type="Motorcycle">Moto</button>
    <button class="filter-btn" data-type="Car / HPDE">Car/HPDE</button>
    <button class="filter-btn" data-type="School">School</button>
  </div>
  <div class="filter-divider"></div>
  <div class="filter-group" id="dayFilters">
    <button class="filter-btn" data-day="Weekday">Weekdays</button>
    <button class="filter-btn" data-day="Weekend">Weekends</button>
  </div>
  <div class="sort-bar">
    <span class="sort-label">Sort</span>
    <select id="sortSelect">
      <option value="date">Date</option>
      <option value="track">Track</option>
      <option value="organizer">Organizer</option>
    </select>
  </div>
</div>
<div class="count" id="countLabel"></div>
<table>
  <thead>
    <tr>
      <th data-col="date">Date <span class="sort-icon">↕</span></th>
      <th data-col="track">Track <span class="sort-icon">↕</span></th>
      <th data-col="event">Event / Organizer</th>
      <th data-col="type">Type <span class="sort-icon">↕</span></th>
      <th data-col="price">Price</th>
      <th>Register</th>
    </tr>
  </thead>
  <tbody id="tableBody"></tbody>
</table>
<script>
// 2027 sources — to be verified as 2027 schedules are announced:
// Checked Oct 28, 2026: SpeedSF (preliminary — dates subject to change), NASA NorCal, and MotoAmerica Speedfest verified and added below; CSS 2027 still unpublished (expected mid-Nov); other orgs' 2027 schedules not yet found.
// superbikeschool.com/schedule, ridelikeachampion.com, cartersatthetrack.com,
// funtrackdayz.com, pacifictracktime.com, z2trackdays.com, volantvivere.com,
// hookedondriving.motorsportreg.com, motorsportreg.com/orgs/speedsf,
// lightspeedtrackevents.com, gglotus.org, members.drivenasa.com (NASA NorCal),
// sonomaraceway.com (open track days), weathertechraceway.com, grid.life,
// events.racingamerica.com
// Add new 2027 event objects to the `events` array below, following this format:
// { date:"YYYY-MM-DD", end:"YYYY-MM-DD", track:"Track Name", event:"Event Title", organizer:"Org Name", type:"Motorcycle|Car / HPDE|School", price:"$XXX", url:"https://..." }
// The `end` field is optional (omit for single-day events).
const events = [
  // ══ LAGUNA SECA ══
  { date:"2027-03-06", end:"2027-03-07", track:"Laguna Seca", event:"NCRC × SpeedSF — HPDE", organizer:"SpeedSF / NCRC", type:"Car / HPDE", price:"TBD", url:"https://www.speedsf.com/events2026" },
  { date:"2027-03-20", end:"2027-03-21", track:"Laguna Seca", event:"Speed SF — HPDE", organizer:"SpeedSF", type:"Car / HPDE", price:"TBD", url:"https://www.speedsf.com/events2026" },
  { date:"2027-05-22", end:"2027-05-23", track:"Laguna Seca", event:"Speed SF — HPDE", organizer:"SpeedSF", type:"Car / HPDE", price:"TBD", url:"https://www.speedsf.com/events2026" },
  { date:"2027-07-09", end:"2027-07-11", track:"Laguna Seca", event:"MotoAmerica Speedfest at Monterey", organizer:"MotoAmerica", type:"Motorcycle", price:"TBD", url:"https://www.motoamerica.com/2027-motoamerica-ticket-sales-announced-for-three-iconic-venues/" },
  { date:"2027-08-07", end:"2027-08-08", track:"Laguna Seca", event:"Monterey Pre-Reunion & Corkscrew Hillclimb", organizer:"WeatherTech Raceway", type:"Car / HPDE", price:"TBD", url:"https://whatsupmonterey.com/events/monterey-car-week/monterey-pre-reunion/618" },
  // ══ SONOMA RACEWAY ══
  { date:"2027-01-23", end:"2027-01-24", track:"Sonoma Raceway", event:"Speed SF — HPDE", organizer:"SpeedSF", type:"Car / HPDE", price:"TBD", url:"https://www.speedsf.com/events2026" },
  { date:"2027-02-27", end:"2027-02-28", track:"Sonoma Raceway", event:"Speed SF — HPDE", organizer:"SpeedSF", type:"Car / HPDE", price:"TBD", url:"https://www.speedsf.com/events2026" },
  { date:"2027-03-13", end:"2027-03-14", track:"Sonoma Raceway", event:"NASA NorCal — HPDE, Time Trial & Sprint", organizer:"NASA NorCal", type:"Car / HPDE", price:"TBD", url:"https://members.drivenasa.com/regions/2" },
  { date:"2027-05-07", end:"2027-05-09", track:"Sonoma Raceway", event:"Speed SF — HPDE (3-Day)", organizer:"SpeedSF", type:"Car / HPDE", price:"TBD", url:"https://www.speedsf.com/events2026" },
  { date:"2027-05-29", end:"2027-05-30", track:"Sonoma Raceway", event:"NASA NorCal — HPDE, Time Trial & Sprint", organizer:"NASA NorCal", type:"Car / HPDE", price:"TBD", url:"https://members.drivenasa.com/regions/2" },
  { date:"2027-06-25", end:"2027-06-27", track:"Sonoma Raceway", event:"Speed SF — HPDE (3-Day)", organizer:"SpeedSF", type:"Car / HPDE", price:"TBD", url:"https://www.speedsf.com/events2026" },
  { date:"2027-07-16", end:"2027-07-18", track:"Sonoma Raceway", event:"NASA NorCal — HPDE, Time Trial & Sprint (X-Over SoCal)", organizer:"NASA NorCal", type:"Car / HPDE", price:"TBD", url:"https://members.drivenasa.com/regions/2" },
  { date:"2027-09-17", end:"2027-09-19", track:"Sonoma Raceway", event:"Speed SF — HPDE (3-Day)", organizer:"SpeedSF", type:"Car / HPDE", price:"TBD", url:"https://www.speedsf.com/events2026" },
  { date:"2027-11-06", end:"2027-11-07", track:"Sonoma Raceway", event:"NASA NorCal — HPDE, Time Trial & Sprint (Double Points)", organizer:"NASA NorCal", type:"Car / HPDE", price:"TBD", url:"https://members.drivenasa.com/regions/2" },
  { date:"2027-11-27", end:"2027-11-28", track:"Sonoma Raceway", event:"Speed SF — HPDE", organizer:"SpeedSF", type:"Car / HPDE", price:"TBD", url:"https://www.speedsf.com/events2026" },
  // ══ THUNDERHILL ══
  { date:"2027-01-09", end:"2027-01-10", track:"Thunderhill", event:"Speed SF — Thunderhill East HPDE", organizer:"SpeedSF", type:"Car / HPDE", price:"TBD", url:"https://www.speedsf.com/events2026" },
  { date:"2027-02-20", end:"2027-02-21", track:"Thunderhill", event:"Speed SF — Thunderhill East HPDE", organizer:"SpeedSF", type:"Car / HPDE", price:"TBD", url:"https://www.speedsf.com/events2026" },
  { date:"2027-04-10", end:"2027-04-11", track:"Thunderhill", event:"Speed SF — Thunderhill West HPDE", organizer:"SpeedSF", type:"Car / HPDE", price:"TBD", url:"https://www.speedsf.com/events2026" },
  { date:"2027-05-08", end:"2027-05-09", track:"Thunderhill", event:"NASA NorCal — HPDE, Time Trial & Sprint", organizer:"NASA NorCal", type:"Car / HPDE", price:"TBD", url:"https://members.drivenasa.com/regions/2" },
  { date:"2027-06-05", end:"2027-06-06", track:"Thunderhill", event:"Speed SF — Thunderhill East HPDE", organizer:"SpeedSF", type:"Car / HPDE", price:"TBD", url:"https://www.speedsf.com/events2026" },
  { date:"2027-09-04", end:"2027-09-06", track:"Thunderhill", event:"Speed SF — Thunderhill East HPDE (3-Day)", organizer:"SpeedSF", type:"Car / HPDE", price:"TBD", url:"https://www.speedsf.com/events2026" },
  { date:"2027-10-23", end:"2027-10-24", track:"Thunderhill", event:"Speed SF — Thunderhill West HPDE", organizer:"SpeedSF", type:"Car / HPDE", price:"TBD", url:"https://www.speedsf.com/events2026" },
  { date:"2027-12-04", end:"2027-12-05", track:"Thunderhill", event:"Speed SF — Thunderhill East HPDE", organizer:"SpeedSF", type:"Car / HPDE", price:"TBD", url:"https://www.speedsf.com/events2026" },
];
const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const days = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
function parseDate(str) { return new Date(str + "T12:00:00"); }
function formatDate(str, endStr) {
  const d = parseDate(str);
  const m = months[d.getMonth()], day = d.getDate(), dow = days[d.getDay()];
  if (endStr) {
    const e = parseDate(endStr);
    if (e.getMonth() !== d.getMonth()) return `${m} ${day}–${months[e.getMonth()]} ${e.getDate()}`;
    return `${m} ${day}–${e.getDate()}`;
  }
  return `${m} ${day} · ${dow}`;
}
let activeTrack = null, activeType = null, activeDay = null, sortCol = "date", sortDir = 1;
function getTrackClass(t) { return t==="Laguna Seca"?"track-Laguna":t==="Sonoma Raceway"?"track-Sonoma":"track-Thunderhill"; }
function getTypeClass(t) { return t==="Motorcycle"?"type-Motorcycle":t==="Car / HPDE"?"type-Car":"type-School"; }
function render() {
  let data = [...events];
  if (activeTrack) data = data.filter(e => e.track === activeTrack);
  if (activeType)  data = data.filter(e => e.type === activeType);
  if (activeDay) {
    data = data.filter(e => {
      const dow = parseDate(e.date).getDay(), isWeekend = dow===0||dow===6;
      return activeDay==="Weekend" ? isWeekend : !isWeekend;
    });
  }
  data.sort((a,b) => {
    const av = sortCol==="date"?a.date:sortCol==="track"?a.track:a.organizer;
    const bv = sortCol==="date"?b.date:sortCol==="track"?b.track:b.organizer;
    return av<bv?-sortDir:av>bv?sortDir:0;
  });
  document.getElementById("countLabel").innerHTML = `<strong>${data.length}</strong> event${data.length!==1?"s":""} shown`;
  const tbody = document.getElementById("tableBody");
  if (!data.length) { tbody.innerHTML=`<tr><td colspan="6" class="empty-state">No events match your filters.</td></tr>`; return; }
  tbody.innerHTML = data.map(e=>`
    <tr>
      <td class="date-cell">${formatDate(e.date,e.end)}</td>
      <td><span class="track-pill ${getTrackClass(e.track)}">${e.track}</span></td>
      <td><div class="event-name">${e.event}</div><div class="event-sub">${e.organizer}</div></td>
      <td><span class="type-badge ${getTypeClass(e.type)}">${e.type}</span></td>
      <td class="price-cell">${e.price}</td>
      <td class="link-cell"><a href="${e.url}" target="_blank">Register →</a></td>
    </tr>`).join("");
}
document.getElementById("trackFilters").addEventListener("click", e => {
  const btn = e.target.closest("button"); if (!btn) return;
  document.querySelectorAll("#trackFilters .filter-btn").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active"); activeTrack = btn.dataset.track||null; render();
});
document.getElementById("typeFilters").addEventListener("click", e => {
  const btn = e.target.closest("button"); if (!btn) return;
  const was = btn.classList.contains("active");
  document.querySelectorAll("#typeFilters .filter-btn").forEach(b=>b.classList.remove("active"));
  if (!was){btn.classList.add("active");activeType=btn.dataset.type;}else{activeType=null;} render();
});
document.getElementById("dayFilters").addEventListener("click", e => {
  const btn = e.target.closest("button"); if (!btn) return;
  const was = btn.classList.contains("active");
  document.querySelectorAll("#dayFilters .filter-btn").forEach(b=>b.classList.remove("active"));
  if (!was){btn.classList.add("active");activeDay=btn.dataset.day;}else{activeDay=null;} render();
});
document.getElementById("sortSelect").addEventListener("change", e=>{sortCol=e.target.value;render();});
document.querySelectorAll("thead th[data-col]").forEach(th=>{
  th.addEventListener("click",()=>{
    const col=th.dataset.col;
    if(sortCol===col){sortDir*=-1;}else{sortCol=col;sortDir=1;}
    document.getElementById("sortSelect").value=col;
    document.querySelectorAll("thead th").forEach(h=>h.classList.remove("sorted"));
    th.classList.add("sorted");
    th.querySelector(".sort-icon").textContent=sortDir===1?"↑":"↓";
    render();
  });
});
render();
</script>
</body>
</html>
